<style>
/* layout: one phone-width column; a five-stop path, each stop owns one soft tint from the same family */
:root{
  --bg:#F5F2F7; --paper:#FFFDFB; --ink:#4D4560; --ink2:#7D758C; --line:#E3DCEB;
  --plum:#7A6A9E; --plum-d:#5F5184;
  --lav:#D9D0EA; --lav-s:#EEE9F5;
  --rose:#E7CCD6; --rose-s:#F7ECF0;
  --butter:#F0E2BC; --butter-s:#FAF4E1;
  --sage:#C8D9CB; --sage-s:#EAF2EA;
  --mist:#CAD7E7; --mist-s:#EBF0F7;
  --good:#5E8468; --bad:#A26478;
  --zh:"Huninn","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --num:"Quicksand","Huninn","PingFang TC",sans-serif;
  --tint:var(--lav); --tint-s:var(--lav-s);
}
body{background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:18px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
body.en{font-family:var(--num);line-height:1.6}
body.zy{font-family:"Bpmf Huninn",var(--zh);font-size:19px;line-height:1.9}body.zy h1{font-size:22px}body.zy h2{font-size:20px}
body.zy .soft{font-size:17px}body.zy .stop .t>span{font-size:16px}body.zy .stop .t b{font-size:19px}.seg,.back,.snd{font-family:var(--zh)}
body.zy .soft{font-size:18px}body.zy .stop .t>span{font-size:17px}body.zy .seg button{font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:10px 92px}
.bar{display:flex;align-items:center;gap:8px;min-height:48px}
.back{width:44px;height:44px;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-size:22px;line-height:1;color:var(--plum-d);flex:none}
.seg{margin-left:auto;display:flex;background:var(--lav-s);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:15px;color:var(--ink2);min-height:38px}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 10px rgba(77,69,96,.1)}
.savewarn{background:var(--butter-s);border:2px solid var(--butter);border-radius:16px;padding:12px 14px;margin:0 0 12px}.savewarn p{margin:0 0 8px}
.crt td.pt{background:none;padding:0 1px;font-size:24px;font-weight:700}
.shapes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.colc{display:inline-block;text-align:right;font-size:24px;line-height:1.6;padding:2px 12px;letter-spacing:.04em}.colc div:last-child{border-bottom:2px solid var(--ink);padding-bottom:2px}
.gchip{font:inherit;color:inherit;background:none;border:0;padding:6px 0;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}.gchip .ga{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--plum);flex:none;margin-left:2px}.gchip .ga svg{width:10px;height:10px;display:block;margin-top:2px}
.grades{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.gcard{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 10px;min-height:96px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.gcard .num{font-size:30px;line-height:1.1;color:var(--plum)}.gcard.on{border-color:var(--plum);background:var(--lav-s)}.gcard:disabled{opacity:.55;cursor:default}.gcard .soft{font-size:14px}
.seg.bktab,.seg.termtab{margin:0 0 10px;width:max-content}.termrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 10px}.termrow .seg.termtab{margin:0}.termrow p{margin:0}
.seg.bktab button,.seg.termtab button{padding:6px 18px}
h2.term{font-size:18px;color:var(--ink2);margin:18px 0 8px}
.rail{position:relative;height:8px;background:var(--lav);border-radius:4px;margin:26px 18px 22px;width:calc(100% - 36px)}
.rail i{position:absolute;top:-16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px;color:var(--ink)}
.rail .a{left:0;background:var(--rose)}.rail .b{background:var(--mist)}
.net{display:grid;grid-template-columns:repeat(4,34px);grid-template-rows:repeat(3,34px);gap:3px}
.net i{background:var(--butter);border:1.5px solid var(--ink2);border-radius:4px}
.bars{width:100%}.bars>div{display:flex;align-items:center;gap:8px;margin:6px 0}.bars>div>span:first-child{min-width:3.2em}
.bars b{height:24px;border-radius:6px;background:var(--lav)}.bars>div:nth-child(2) b{background:var(--rose)}
.pie{width:150px;height:150px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center}.legend>span{display:flex;align-items:center;gap:6px;white-space:nowrap}.crt{border-collapse:separate;border-spacing:4px;font-family:var(--num)}.crt th{font-weight:400;text-align:left;padding-right:4px;font-family:var(--zh)}.crt td{min-width:36px;height:36px;text-align:center;background:var(--lav-s);border-radius:8px;font-weight:700}.crt tr:last-child td{background:var(--butter-s)}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

.snd{width:44px;height:44px;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-size:15px;color:var(--plum-d);flex:none;position:relative}
.snd.off{color:var(--ink2)}
.kchip{width:48px;height:48px;padding:2px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.kav{display:block;width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--paper);box-shadow:0 0 0 2.5px var(--plum);flex:none}
.kav img{display:block;width:100%;height:100%;pointer-events:none}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px;margin:6px 0 4px}
.kcell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;color:var(--ink2);min-width:0;padding:4px 0}
.kcell .kav{width:60px;height:60px;box-shadow:0 0 0 2px var(--line)}
.kcell.on .kav{box-shadow:0 0 0 3.5px var(--plum)}
.kcell.on{color:var(--ink)}
.kplus{display:flex!important;align-items:center;justify-content:center;font-size:28px;color:var(--plum);box-shadow:0 0 0 2px var(--lav)!important;background:var(--lav-s)}
.krow{display:flex;align-items:center;gap:10px;padding:6px 0}.krow .kav{width:38px;height:38px}
.krow .kdel{width:auto;min-height:40px;margin-left:auto;padding:4px 14px;font-size:16px}
.krow.now{padding:0}
.resume{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:-6px}.resume .tbtn{flex:none}
.snd.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--ink2);transform:rotate(-40deg)}
h1{font-size:26px;line-height:1.4;margin:0;font-weight:400;text-wrap:balance}
h2{font-size:22px;line-height:1.45;margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
.soft{color:var(--ink2);font-size:16px}
.hero{display:flex;align-items:center;gap:10px}
.hero img{width:112px;height:auto;flex:none}
.hero>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.path{display:flex;flex-direction:column;gap:10px}
.stop{display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:12px 14px;min-height:72px;transition:scale .1s}
.stop:active,.btn:active,.opt:active,.key:active{scale:.97}
.stop .n{width:44px;height:44px;border-radius:14px;background:var(--tint);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:20px;flex:none}
.stop .t{min-width:0;display:flex;flex-direction:column;flex:1}
.stop .t b{font-weight:400;font-size:20px;line-height:1.5}
.stop .t>span{color:var(--ink2);font-size:15px;line-height:1.5}
.stop .ok{font-size:14px;color:var(--good);background:var(--sage-s);border-radius:999px;padding:2px 10px;flex:none}
.c1{--tint:var(--lav);--tint-s:var(--lav-s)}.c2{--tint:var(--rose);--tint-s:var(--rose-s)}.c3{--tint:var(--butter);--tint-s:var(--butter-s)}.c4{--tint:var(--sage);--tint-s:var(--sage-s)}.c5{--tint:var(--mist);--tint-s:var(--mist-s)}
.head{display:flex;align-items:center;gap:10px}
.head .n{width:36px;height:36px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-family:var(--num);font-weight:700;flex:none}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--plum)}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.talk{display:flex;gap:10px;align-items:flex-start}
.talk img{width:64px;height:auto;flex:none}
.talk p{background:var(--tint-s);border-radius:16px;padding:10px 14px;min-width:0;flex:1}
.talk p.fb{background:var(--rose-s)}
.big{font-family:var(--num);font-size:30px;font-weight:700;text-align:center;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;line-height:1.2}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:var(--num);font-weight:700;line-height:1.15;margin:0 3px;font-size:.92em}
.fr i{font-style:normal;padding:0 4px;min-width:1.1em;text-align:center}
.fr i:first-child{border-bottom:2px solid currentColor}
.num{font-family:var(--num);font-weight:700}
.nw{white-space:nowrap}
.zy{display:inline-flex;align-items:center;margin-right:2px}
.zy .zr{display:inline-flex;flex-direction:column;align-items:center;font-size:.37em;line-height:1.02;margin-left:1px;color:var(--ink2)}
.zy .zr i{font-style:normal}
.zy .zt{font-size:.4em;line-height:1;color:var(--ink2);align-self:center;margin-left:-1px;transform:translateY(-.5em);width:.6em}
.vis{display:flex;flex-direction:column;gap:8px;align-items:center;padding:6px 0}
.cake{display:flex;width:100%;max-width:340px;height:46px;border:2.5px solid var(--plum-d);border-radius:12px;overflow:hidden;background:var(--paper)}
.cake span{flex:1;border-right:2px dashed transparent;transition:background .3s,border-color .3s}
.cake span:last-child{border-right:0}
.cake.cut span{border-right-color:var(--plum-d)}
.cake span.f{background:var(--lav)}
.cake span.g0{background:var(--rose)}.cake span.g1{background:var(--butter)}.cake span.g2{background:var(--sage)}
.beads{display:flex;gap:14px}
.beads span{display:flex;gap:5px;padding:6px 8px;border-radius:999px;background:var(--lav-s)}
.beads i{width:22px;height:22px;border-radius:50%;background:var(--plum)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:16px;min-height:60px;padding:8px 10px;font-size:20px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;transition:scale .1s}
.opt:not(.txt){white-space:nowrap}
.opt.txt{display:block;font-size:18px;justify-content:flex-start;text-align:left;padding:10px 14px}
.opt.right{background:var(--sage-s);border-color:var(--good)}
.opt.wrong{border-style:dashed;color:var(--ink2)}
.fb{border-radius:16px;padding:10px 14px;background:var(--rose-s);border-left:0}
.fb.good{background:var(--sage-s)}
.fb .tag{font-size:15px;color:var(--bad);display:block}
.fb.good .tag{color:var(--good)}
.btn{background:var(--plum);color:#fff;border-radius:16px;min-height:54px;padding:10px 18px;font-size:20px;width:100%;transition:scale .1s}
.btn.ghost{background:var(--paper);color:var(--plum-d);border:2px solid var(--lav);font-size:18px;min-height:48px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.steps{display:flex;flex-direction:column;gap:8px}
.steps>div{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:14px;background:var(--bg);color:var(--ink2)}
.steps>div.now{background:var(--tint-s);color:var(--ink)}
.steps>div>b{font-family:var(--num);flex:none;width:1.2em}
.steps>div>span{min-width:0}
.line{font-family:var(--num);font-size:24px;font-weight:700;text-align:center;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.ans{display:inline-flex;flex-direction:column;gap:4px;align-items:stretch;max-width:100%}
.ans button{min-width:74px;width:auto;padding:0 12px;white-space:nowrap;height:50px;border:2.5px solid var(--line);border-radius:12px;background:var(--paper);font-family:var(--num);font-weight:700;font-size:26px}
.ans button.on{border-color:var(--plum);background:var(--lav-s)}
.ans hr{width:auto;min-width:80px;border:0;border-top:3px solid var(--ink);margin:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:50px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-family:var(--num);font-weight:700;font-size:22px;transition:scale .1s}
.done{align-items:center;text-align:center}
.done img{width:150px}
.stars{display:flex;gap:8px;justify-content:center}
.stars img{width:64px;height:auto;animation:pop .35s both}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.sheet{position:fixed;inset:0;background:rgba(77,69,96,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet .card{width:100%;max-width:480px;max-height:86%;overflow:auto}
.cf{position:fixed;left:50%;top:38%;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:30;animation:fly .9s ease-out forwards}

.slots{display:flex;gap:6px;align-items:center}
.slots img,.slots i{width:28px;height:28px;flex:none}
.slots i{border:1.5px dashed var(--lav);border-radius:50%}
.stop img.got{width:32px;height:32px;flex:none}
.stop .t .slots{margin-top:4px}
.tally{display:flex;align-items:center;gap:8px;background:var(--butter-s);border-radius:16px;padding:8px 14px}
.tally img{width:30px;height:30px;flex:none}
.tally span{flex:1;min-width:0}
.tally b{font-size:20px}
.chiprow{display:flex;align-items:flex-start;gap:8px;width:100%}
.chiprow>span{flex:none;width:2em;text-align:right;font-family:var(--num);font-weight:700;line-height:38px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chips b{font-family:var(--num);min-width:38px;height:38px;padding:0 6px;border-radius:12px;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-size:18px;transition:background .3s}
.chips b.hit{background:var(--butter);border-color:#D8C68F}
.dotg{display:grid;gap:6px}
.dotg i{width:22px;height:22px;border-radius:50%;background:var(--plum)}
.dotg i.x{background:var(--rose);outline:2px dashed var(--bad);outline-offset:1px}
.ladder{font-family:var(--num);font-weight:700;font-size:22px;line-height:1.5}
.lr{display:flex}
.lr b{width:1.8em;text-align:right;padding-right:8px;color:var(--plum-d)}
.lr span{width:2.6em;text-align:center}
.lr.d span{border-bottom:2.5px solid var(--ink)}
.lr.d b+span{border-left:2.5px solid var(--ink)}
.key.hintk{font-family:inherit;font-weight:400;font-size:17px}
.pet{padding:0;flex:none;border-radius:24px;line-height:0}
.pet.hop img{animation:hop .5s}.pet.wig img{animation:wig .5s}.pet.spin img{animation:spin .7s}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-18px) scale(1.05,.95)}60%{transform:translateY(0) scale(.95,1.05)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}

.pf{position:fixed;width:22px;height:22px;pointer-events:none;z-index:30;animation:fly .8s ease-out forwards}
.stop:disabled{opacity:.6}
.stop .th{width:72px;height:56px;object-fit:contain;flex:none}
.stop .soon{font-size:14px;color:var(--ink2);background:var(--bg);border-radius:999px;padding:2px 10px;flex:none}
.stop.klass{background:var(--lav-s);border-color:var(--lav)}
.roompic{width:100%;max-width:340px;height:auto;align-self:center}
.gotstk{display:flex;align-items:center;gap:10px;background:var(--butter-s);border-radius:16px;padding:8px 14px}
.gotstk img{width:56px;height:56px;flex:none}
.bigstk{width:150px;height:150px;animation:pop .45s both}
.scene{position:relative;width:100%;max-width:420px;align-self:center}
.scene>img.bg{width:100%;display:block}
.scene .cb{position:absolute;left:29%;width:36%;bottom:28.4%;pointer-events:none;transform-origin:50% 100%}
.scene .cb.hop{animation:bob .55s 3}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-3deg)}75%{transform:translateY(-3px) rotate(3deg)}}
.scene .fg{position:absolute;left:0;top:0;width:100%;clip-path:inset(68.7% 0 0 0);pointer-events:none}

.hot{position:absolute;border-radius:18px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.books{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.bookpage{position:relative;width:100%;max-width:420px;align-self:center;aspect-ratio:2/3;background:var(--paper);border:2px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}

.beadrow{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}

function audioCtx(){

/* unlock audio on first touch */
function unlockAudio(){
  try {
    const c = audioCtx();
    if (c.state !== "running") c.resume();

    src.buffer = b; src.connect(c.destination); src.start(0);

function tone(f1,f2,dur,type,vol,delay){
  if (muted) return;
  try {
    const c = audioCtx();
    const play = ()=>{
      const t = c.currentTime + (delay||0), o = c.createOscillator(), g = c.createGain();
      o.type = type||"sine"; o.frequency.setValueAtTime(f1,t); o.frequency.linearRampToValueAtTime(f2,t+dur);
      g.gain.setValueAtTime(vol||.14,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
    };
    if (c.state !== "running") c.resume().then(play, ()=>{}); else play();
  } catch(e){}
}

  const cols = ["#D9D0EA","#E7CCD6","#F0E2BC","#C8D9CB","#CAD7E7"];

function qRewrite(a,b,c,d,k){

function chipRow(label,nums,hit){
  return '<div class="chiprow"><span>'+label+'</span><div class="chips">'+nums.map(n=>'<b class="'+(hit&&hit.includes(n)?"hit":"")+'">'+n+'</b>').join("")+'</div></div>';
}
function dotGrid(n,per){
  const full=Math.floor(n/per)*per; let h="";
  for(let i=0;i<n;i++) h+='<i class="'+(i>=full?"x":"")+'"></i>';
  return '<div class="vis"><div class="dotg" style="grid-template-columns:repeat('+per+',22px)">'+h+'</div></div>';
}
function ladderOf(a,b){
  const rows=[]; let x=a,y=b;
  for(;;){ let p=0; for(let k=2;k<=Math.min(x,y);k++) if(x%k===0&&y%k===0){p=k;break} if(!p)break; rows.push([p,x,y]); x/=p; y/=p; }
  return {rows,x,y,left:rows.map(r=>r[0])};
}
function ladder(a,b,upto){
  const T=ladderOf(a,b), n=upto==null?T.rows.length:Math.min(upto,T.rows.length);
  let h='<div class="vis"><div class="ladder">';
  T.rows.slice(0,n).forEach(r=>{h+='<div class="lr d"><b>'+r[0]+'</b><span>'+r[1]+'</span><span>'+r[2]+'</span></div>'});
  const last=n<T.rows.length?[T.rows[n][1],T.rows[n][2]]:[T.x,T.y];
  return h+'<div class="lr"><b></b><span>'+last[0]+'</span><span>'+last[1]+'</span></div></div></div>';
}

function qFirst(a,b){
  const p=ladderOf(a,b).left[0], c=[3,4,7,9,5].filter(k=>!(a%k===0&&b%k===0)).slice(0,3);
  return {ask:L("第一步，"+a+" 跟 "+b+" 可以一起除以哪一個數？","First step: which number divides both "+a+" and "+b+"?"), opts:rot([{h:String(p),ok:1}].concat(c.map(k=>({h:String(k), fb:
    a%k===0?L(k+" 可以整除 "+a+"，可是不能整除 "+b+"。",k+" divides "+a+" but not "+b+"."):
    b%k===0?L(k+" 可以整除 "+b+"，可是不能整除 "+a+"。",k+" divides "+b+" but not "+a+"."):
    L(k+" 不能整除 "+a+"，也不能整除 "+b+"。",k+" divides neither "+a+" nor "+b+".")}))),1)};
}
function qGcf(a,b,k){
  const g=gcd(a,b), l=lcm(a,b), p=ladderOf(a,b).left[0], x=g*2===l?g*3:g*2;
  const o=[{h:String(g),ok:1},{h:String(l), fb:L("這是最小公倍數。最大公因數只乘左邊的數。","That is the lowest common multiple. For the GCF, multiply only the left numbers.")},
    {h:String(x), fb:L(x+" 不能同時整除 "+a+" 跟 "+b+"。",x+" does not divide both "+a+" and "+b+".")}];
  if(p!==g) o.push({h:String(p), fb:L(p+" 是公因數，可是還有更大的。左邊的數要全部相乘。",p+" is a common factor, but there is a bigger one. Multiply all the left numbers.")});
  return {ask:L(a+" 跟 "+b+" 的最大公因數是多少？","What is the greatest common factor of "+a+" and "+b+"?"), opts:rot(uniq(o),k)};
}
function qLcm(a,b,k){
  const g=gcd(a,b), l=lcm(a,b), x=l%2===0?l/2:l+g, hi=Math.max(a,b), lo=Math.min(a,b);
  const o=[{h:String(l),ok:1},{h:String(g), fb:L("這是最大公因數。最小公倍數要把左邊跟最下面的數全部相乘。","That is the greatest common factor. For the LCM, multiply the left numbers and the bottom numbers.")},
    {h:String(x), fb:L(x+" 不是 "+a+" 跟 "+b+" 共同的倍數。",x+" is not a multiple of both "+a+" and "+b+".")}];
  if(a*b!==l) o.push({h:String(a*b), fb:L(a*b+" 是公倍數，可是還有更小的。",a*b+" is a common multiple, but there is a smaller one.")});
  else if(hi%lo!==0) o.push({h:String(hi), fb:L(hi+" 不是 "+lo+" 的倍數。",hi+" is not a multiple of "+lo+".")});
  return {ask:L(a+" 跟 "+b+" 的最小公倍數是多少？","What is the lowest common multiple of "+a+" and "+b+"?"), opts:rot(uniq(o),k)};
}

function checkInt(){
  const [kind,a,b]=pages[pg].int, g=gcd(a,b), l=lcm(a,b), want=kind==="g"?g:l;
  if (!P.num) return setFb(L("先把答案填進去。","Type your answer first."));
  const n=+P.num;
  if (n===want) { P.ok=true; P.fb=null; sfx.right(); return render(); }
  P.tries=(P.tries||0)+1;
  let f;
  if (kind==="g") {
    if (n===l) f=L("這是最小公倍數。這一題問的是最大公因數。","That is the lowest common multiple. This one asks for the greatest common factor.");
    else if (n>0&&a%n===0&&b%n===0) f=L(n+" 是公因數，可是還有更大的。","Yes, "+n+" is a common factor, but there is a bigger one.");
    else if (n>0&&a%n===0) f=L(n+" 可以整除 "+a+"，可是不能整除 "+b+"。",n+" divides "+a+" but not "+b+".");
    else if (n>0&&b%n===0) f=L(n+" 可以整除 "+b+"，可是不能整除 "+a+"。",n+" divides "+b+" but not "+a+".");
  } else {
    if (n===g) f=L("這是最大公因數。這一題問的是最小公倍數。","That is the greatest common factor. This one asks for the lowest common multiple.");
    else if (n>0&&n%a===0&&n%b===0) f=L(n+" 是公倍數，可是還有更小的。","Yes, "+n+" is a common multiple, but there is a smaller one.");
    else if (n>0&&n%a===0) f=L(n+" 是 "+a+" 的倍數，可是不是 "+b+" 的倍數。",n+" is a multiple of "+a+" but not of "+b+".");
    else if (n>0&&n%b===0) f=L(n+" 是 "+b+" 的倍數，可是不是 "+a+" 的倍數。",n+" is a multiple of "+b+" but not of "+a+".");
  }
  if (!f) f=P.tries>=2?L("還沒有對。可以按「提示」，看下一步怎麼做。","Not yet. Tap Hint to see the next step."):L("還沒有對。用短除法再檢查一次。","Not yet. Check again with the ladder method.");
  setFb(f);
}

function lampLine(n,lamps,loop){
  let h='<div class="vis"><div class="lamp'+(loop?" loop":"")+'">';
  for(let i=0;i<=n;i++){ if(!(loop&&i===n)) h+='<span class="tk"'+(loop?' style="transform:rotate('+(360/n*i)+'deg) translateY(-56px)"':"")+'>'+(lamps?"<i></i>":"")+'</span>'; if(i<n&&!loop) h+='<span class="gap"></span>'; }
  return h+'</div></div>';
}
function twoRows(a,b,add){
  const row=(n)=>'<div class="fd wide">'+"<i></i>".repeat(n)+'<i class="x"></i>'.repeat(add||0)+'</div>';
  return '<div class="vis">'+row(a)+row(b)+'</div>';
}

function net(){ const at=[[1,2],[2,1],[2,2],[2,3],[2,4],[3,2]]; return '<div class="vis"><div class="net">'+at.map(a=>'<i style="grid-area:'+a[0]+'/'+a[1]+'"></i>').join("")+'</div></div>'; }

function pie(parts,hide){ let a=0; const g=parts.map((p,i)=>{const s=a; a+=p[1]; return PIEC[i]+" "+s+"% "+a+"%";}).join(",");

function boxes(w,h,n){ return '<div class="vis"><div class="grs">'+gridRect(w,h)+'</div><p class="soft">'+tx(L("一層 "+(w*h)+" 個，疊 "+n+" 層","One layer has "+(w*h)+". Stack "+n+" layers."))+'</p></div>'; }

/* place-value chart for a number below 10 with up to 3 decimal places */
function pvt(n){
  const [a,b=""]=String(n).split("."), ds=[a].concat(b.padEnd(3," ").split(""));
  const hs=[L("個位","Ones"),L("十分位","Tenths"),L("百分位","Hundredths"),L("千分位","Thousandths")];
  return '<div class="vis"><table class="crt"><tr>'+hs.map((h,i)=>(i===1?'<th></th>':'')+'<th>'+tx(h)+'</th>').join("")+'</tr><tr>'+ds.map((d,i)=>(i===1?'<td class="pt">.</td>':'')+'<td class="num">'+d+'</td>').join("")+'</tr></table></div>';
}
/* column layout for adding or subtracting decimals, points lined up */
function colCalc(a,b,op){
  const da=Math.max((String(a).split(".")[1]||"").length,(String(b).split(".")[1]||"").length);
  const f=x=>Number(x).toFixed(da);
  return '<div class="vis"><div class="colc num"><div>'+f(a)+'</div><div>'+op+' '+f(b)+'</div></div></div>';
}
/* number line from lo to hi in tenths (or ones), with an arrow at x; numbers only */
function nline(lo,hi,x,step){ const n=Math.round((hi-lo)/step), X=v=>20+(v-lo)/(hi-lo)*200; let h='<line x1="20" y1="40" x2="220" y2="40" stroke="var(--plum)" stroke-width="3"/>';
  for(let i=0;i<=n;i++){ const v=lo+i*step; h+='<line x1="'+X(v)+'" y1="'+(i===0||i===n||i===n/2?30:34)+'" x2="'+X(v)+'" y2="'+(i===0||i===n||i===n/2?50:46)+'" stroke="var(--plum)" stroke-width="2"/>'; }
  h+='<text x="20" y="70" text-anchor="middle">'+lo+'</text><text x="220" y="70" text-anchor="middle">'+hi+'</text><text x="120" y="70" text-anchor="middle" fill="var(--ink2)">'+(+(lo+(hi-lo)/2).toFixed(3))+'</text>';
  h+='<polygon points="'+X(x)+',36 '+(X(x)-6)+',22 '+(X(x)+6)+',22" fill="var(--bad)"/><text x="'+X(x)+'" y="16" text-anchor="middle" fill="var(--bad)">'+x+'</text>';
  return '<div class="vis"><svg viewBox="0 0 240 80" width="240" height="80" role="img" aria-label="number line" style="font-family:var(--num);font-weight:700;font-size:13px">'+h+'</svg></div>'; }

  return ASV('<polygon points="20,'+y0+' 120,'+y0+' '+(120+o)+','+y1+' '+(20+o)+','+y1+'" '+AFILL+'/>'+AH(20+o,y1,y0)+AT(70,y0+16,b)+AT(10+o,(y0+y1)/2+5,h,"var(--bad)")+(s?AT(130+o/2+6,(y0+y1)/2+5,s):""),"parallelogram"); }
function shRectA(b,h){ return ASV('<rect x="35" y="25" width="100" height="60" '+AFILL+'/>'+AT(85,102,b)+AT(22,60,h,"var(--bad)"),"rectangle"); }
function shTriA(b,h,s){ const k=b?120/b:20, H=Math.min(75,(h||3.5)*k), y0=90, y1=y0-H;
  return ASV('<polygon points="20,'+y0+' 140,'+y0+' 70,'+y1+'" '+AFILL+'/>'+AH(70,y1,y0)+AT(80,y0+16,b)+AT(58,(y0+y1)/2+5,h,"var(--bad)")+(s?AT(122,(y0+y1)/2,s):""),"triangle"); }
function shTrapA(t,b,h){ const k=b?140/b:20, T=(t||3)*k, H=Math.min(70,(h||3)*k), y0=88, y1=y0-H, x1=15+(140-T)/2;
  return ASV('<polygon points="15,'+y0+' 155,'+y0+' '+(x1+T)+','+y1+' '+x1+','+y1+'" '+AFILL+'/>'+AH(x1,y1,y0)+AT(85,y1-6,t)+AT(85,y0+16,b)+AT(x1-11,(y0+y1)/2+5,h,"var(--bad)"),"trapezoid"); }
function shLA(){ return ASV('<polygon points="20,15 140,15 140,95 68,95 68,55 20,55" '+AFILL+'/>'+AT(80,11,10)+AT(152,58,6)+AT(44,74,4)+AT(78,79,3),"L shape"); }

  '<line x1="60" y1="20" x2="60" y2="95" stroke="var(--bad)" stroke-width="2" stroke-dasharray="5 4"/><line x1="150" y1="95" x2="48.8" y2="41" stroke="var(--bad)" stroke-width="2" stroke-dasharray="5 4"/><line x1="150" y1="95" x2="40" y2="57.5" stroke="var(--bad)" stroke-width="2" stroke-dasharray="5 4"/>'+
  AT(66,88,"A","var(--bad)")+AT(104,62,"B","var(--bad)")+AT(96,84,"C","var(--bad)"),"triangle with three dashed lines A, B, C"); }

/* line drawings of solids (viewed a little from above) */
const VSV = (inner,label)=>'<svg viewBox="0 0 120 120" width="84" height="84" role="img" aria-label="'+(label||"")+'" style="fill:none;stroke:var(--plum);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round">'+inner+'</svg>';
const VDASH = ' style="stroke-dasharray:5 4;stroke-width:1.8"';
const vln = (a,b,d)=>'<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'"'+(d?VDASH:"")+'/>';
function vbase(n,cy,rx,ry){ const p=[], o=Math.PI/2+0.2; for(let i=0;i<n;i++){ const t=o+i*2*Math.PI/n; p.push([60+rx*Math.cos(t), cy+ry*Math.sin(t), Math.sin(t)]); } return p; }
function prismSV(n){
  const b=vbase(n,92,40,14), t=b.map(p=>[p[0],p[1]-58,p[2]]); let h='<polygon points="'+t.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" style="fill:var(--lav-s)"/>';
  for(let i=0;i<n;i++){ const j=(i+1)%n, mid=Math.sin(Math.atan2((b[i][1]+b[j][1])/2-92,((b[i][0]+b[j][0])/2-60)*14/40)); h+=vln(b[i],b[j],mid<0.05); h+=vln(b[i],t[i],b[i][2]<-0.3); }
  return VSV(h,n+"-sided prism");
}
function pyrSV(n){
  const b=vbase(n,92,42,15), a=[60,14]; let h="";
  for(let i=0;i<n;i++){ const j=(i+1)%n, mid=Math.sin(Math.atan2((b[i][1]+b[j][1])/2-92,((b[i][0]+b[j][0])/2-60)*15/42)); h+=vln(b[i],b[j],mid<0.05); h+=vln(b[i],a,b[i][2]<-0.3); }
  return VSV(h,n+"-sided pyramid");
}

}

/* oblique drawing of a box made of unit cubes: front face true size, depth drawn up and to the right */
function vbLine(a,b,c,d){ return '<line x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'" stroke="var(--plum)" stroke-width="1" opacity=".5"/>'; }
function vbBlk(x0,y0,w,d,h,u,grid){
  const W=w*u, H=h*u, ox=d*u*0.5, oy=d*u*0.38, S='stroke="var(--plum)" stroke-width="2.2" stroke-linejoin="round"';

  s+='<polygon points="'+(x0+W)+','+y0+' '+(x0+W+ox)+','+(y0-oy)+' '+(x0+W+ox)+','+(y0-H-oy)+' '+(x0+W)+','+(y0-H)+'" fill="var(--lav)" '+S+'/>';
  s+='<rect x="'+x0+'" y="'+(y0-H)+'" width="'+W+'" height="'+H+'" fill="var(--lav-s)" '+S+'/>';
  if(grid){
    for(let i=1;i<w;i++) s+=vbLine(x0+i*u,y0,x0+i*u,y0-H)+vbLine(x0+i*u,y0-H,x0+i*u+ox,y0-H-oy);
    for(let k=1;k<h;k++) s+=vbLine(x0,y0-k*u,x0+W,y0-k*u)+vbLine(x0+W,y0-k*u,x0+W+ox,y0-k*u-oy);
    for(let j=1;j<d;j++){ const a=ox*j/d, b=oy*j/d; s+=vbLine(x0+a,y0-H-b,x0+W+a,y0-H-b)+vbLine(x0+W+a,y0-b,x0+W+a,y0-H-b); }
  }

}
const VBT = (x,y,t)=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" fill="var(--ink)">'+t+'</text>';

/* one box; lab: [w,d,h] labels to show (numbers or "?"), or false for none */
function boxSV(w,d,h,grid,lab){
  const u=Math.min(24,Math.floor(130/(w+d*0.5)),Math.floor(96/(h+d*0.38))), W=w*u, H=h*u, ox=d*u*0.5, oy=d*u*0.38, x0=28, y0=H+oy+12;
  let s=vbBlk(x0,y0,w,d,h,u,grid);
  if(lab) s+=VBT(x0+W/2,y0+16,lab[0])+VBT(x0+W+ox/2+12,y0-oy/2+10,lab[1])+VBT(x0-12,y0-H/2+5,lab[2]);

/* area model: a/b of the tray (columns), then c/d of that part (rows, darker) */
function fgSV(a,b,c,d,sq){
  const W=sq?130:180, H=sq?130:110, x0=10, y0=10, cw=W/b, rh=H/d;
  let s='<rect x="'+x0+'" y="'+y0+'" width="'+W+'" height="'+H+'" fill="var(--paper)"/>';
  s+='<rect x="'+x0+'" y="'+y0+'" width="'+(cw*a)+'" height="'+H+'" fill="var(--lav-s)"/>';
  if(c) s+='<rect x="'+x0+'" y="'+y0+'" width="'+(cw*a)+'" height="'+(rh*c)+'" fill="var(--plum)" opacity=".45"/>';
  for(let i=1;i<b;i++) s+='<line x1="'+(x0+i*cw)+'" y1="'+y0+'" x2="'+(x0+i*cw)+'" y2="'+(y0+H)+'" stroke="var(--plum)" stroke-width="2"/>';
  if(c) for(let j=1;j<d;j++) s+='<line x1="'+x0+'" y1="'+(y0+j*rh)+'" x2="'+(x0+W)+'" y2="'+(y0+j*rh)+'" stroke="var(--plum)" stroke-width="1.2" stroke-dasharray="4 3"/>';
  s+='<rect x="'+x0+'" y="'+y0+'" width="'+W+'" height="'+H+'" fill="none" stroke="var(--plum)" stroke-width="3" rx="4"/>';
  return '<div class="vis"><svg viewBox="0 0 '+(W+20)+' '+(H+20)+'" width="'+(W+10)+'" role="img" aria-label="tray" style="max-width:100%;height:auto">'+s+'</svg></div>';
}

/* front view of a water tank: walls, water level, optional stone; x is the left edge */
function tankG(x,h,l,stone){
  const k=78/h, W=110, T=5, H=h*k, Lv=l*k, y0=104, wall='fill="var(--plum)"';
  let s='<rect x="'+(x+T)+'" y="'+(y0-T-Lv)+'" width="'+(W-2*T)+'" height="'+Lv+'" fill="var(--mist)" opacity=".75"/>';
  if(stone) s+='<ellipse cx="'+(x+W/2)+'" cy="'+(y0-T-10)+'" rx="20" ry="10" fill="var(--ink)" opacity=".4"/>';
  s+='<rect x="'+x+'" y="'+(y0-T-H)+'" width="'+T+'" height="'+(H+T)+'" '+wall+'/><rect x="'+(x+W-T)+'" y="'+(y0-T-H)+'" width="'+T+'" height="'+(H+T)+'" '+wall+'/><rect x="'+x+'" y="'+(y0-T)+'" width="'+W+'" height="'+T+'" '+wall+'/>';
  s+='<line x1="'+(x+W+3)+'" y1="'+(y0-T-Lv)+'" x2="'+(x+W+11)+'" y2="'+(y0-T-Lv)+'" stroke="var(--bad)" stroke-width="2.5"/><text x="'+(x+W+22)+'" y="'+(y0-T-Lv+5)+'" text-anchor="middle" fill="var(--bad)">'+l+'</text>';
  return s;
}
const TSV = inner=>'<div class="vis"><svg viewBox="0 0 300 116" width="290" role="img" aria-label="water tank" style="max-width:100%;height:auto;font-family:var(--num);font-weight:700;font-size:14px">'+inner+'</svg></div>';
const tankPair = (h,a,b,stoneFirst)=>TSV(tankG(8,h,a,!!stoneFirst)+'<path d="M146 60 h12 m-5 -5 l6 5 l-6 5" fill="none" stroke="var(--plum)" stroke-width="2.5"/>'+tankG(164,h,b,!stoneFirst));
/* open box drawn from the front, walls 1 unit thick: outside w × h, shows inside space */
function boxWallSV(w,h,lid){
  const k=Math.min(14,Math.floor(150/w),Math.floor(90/h)), W=w*k, H=h*k, x=40, y0=H+14, t=k;
  let s='<rect x="'+x+'" y="'+(y0-H)+'" width="'+W+'" height="'+H+'" fill="var(--butter)" stroke="var(--plum)" stroke-width="2"/>';
  s+='<rect x="'+(x+t)+'" y="'+(y0-H+(lid?t:0))+'" width="'+(W-2*t)+'" height="'+(H-t-(lid?t:0))+'" fill="var(--paper)" stroke="var(--plum)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  s+='<text x="'+(x+W/2)+'" y="'+(y0+16)+'" text-anchor="middle" fill="var(--ink)">'+w+'</text><text x="'+(x-14)+'" y="'+(y0-H/2+5)+'" text-anchor="middle" fill="var(--ink)">'+h+'</text>';
  return '<div class="vis"><svg viewBox="0 0 '+(x+W+30)+' '+(y0+24)+'" width="'+Math.min(240,x+W+30)+'" role="img" aria-label="box with thick walls" style="max-width:100%;height:auto;font-family:var(--num);font-weight:700;font-size:13px">'+s+'</svg></div>';
}

/* line graph: xs labels (numbers), ys values; o = {lo, hi, step, broken, tag, w, pts, segs} */
function lineSV(xs,ys,o){
  o=o||{}; const lo=o.lo||0, hi=o.hi, st=o.step, W=o.w||250, x1=36, x2=W-8, yT=o.tag?28:14, yB=o.broken?104:122, n=xs.length;
  const px=i=>x1+(i+0.5)*(x2-x1)/n, py=v=>yB-(v-lo)/(hi-lo)*(yB-yT);
  let s='';
  for(let v=lo; v<=hi+1e-9; v+=st) s+='<line x1="'+x1+'" y1="'+py(v)+'" x2="'+x2+'" y2="'+py(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(x1-5)+'" y="'+(py(v)+4)+'" text-anchor="end">'+v+'</text>';
  s+='<line x1="'+x1+'" y1="'+yT+'" x2="'+x1+'" y2="'+(o.broken?124:yB)+'" stroke="var(--plum)" stroke-width="2"/><line x1="'+x1+'" y1="'+(o.broken?124:yB)+'" x2="'+x2+'" y2="'+(o.broken?124:yB)+'" stroke="var(--plum)" stroke-width="2"/>';
  if(o.broken) s+='<polyline points="'+(x1-6)+',109 '+(x1+6)+',112 '+(x1-6)+',115 '+(x1+6)+',118" fill="none" stroke="var(--plum)" stroke-width="2"/><text x="'+(x1-5)+'" y="128" text-anchor="end">0</text>';
  xs.forEach((x,i)=>{ s+='<text x="'+px(i)+'" y="'+(o.broken?138:136)+'" text-anchor="middle">'+x+'</text>'; });
  if(o.segs!==false && o.pts!==false) s+='<polyline points="'+ys.map((v,i)=>px(i)+','+py(v)).join(" ")+'" fill="none" stroke="var(--bad)" stroke-width="2.5" stroke-linejoin="round"/>';
  if(o.pts!==false) ys.forEach((v,i)=>{ s+='<circle cx="'+px(i)+'" cy="'+py(v)+'" r="4" fill="var(--bad)"/>'; });
  if(o.tag) s+='<text x="'+(x1+4)+'" y="14" font-size="15" fill="var(--plum)">'+o.tag+'</text>';
  return '<svg viewBox="0 0 '+W+' 144" width="'+W+'" role="img" aria-label="line graph" style="max-width:100%;height:auto;font-family:var(--num);font-weight:700;font-size:11px;fill:var(--ink)">'+s+'</svg>';
}

/* 10 × 10 grid with n squares coloured: one square is 1% */
function pctSV(n){
  let s=''; for(let i=0;i<100;i++){ const x=8+(i%10)*12, y=8+Math.floor(i/10)*12; s+='<rect x="'+x+'" y="'+y+'" width="11" height="11" rx="2" fill="'+(i<n?'var(--sage)':'var(--paper)')+'" stroke="var(--plum)" stroke-width="1"/>'; }
  return '<div class="vis"><svg viewBox="0 0 136 136" width="140" role="img" aria-label="'+n+' out of 100" style="max-width:100%;height:auto">'+s+'</svg></div>';
}

/* clock face with hands only (no numerals): h hours, m minutes */
function clockSV(h,m){
  const a=(m/60)*2*Math.PI, b=((h%12)+m/60)/12*2*Math.PI, cx=50, cy=50;
  let s='<circle cx="50" cy="50" r="44" fill="var(--paper)" stroke="var(--plum)" stroke-width="4"/>';
  for(let i=0;i<12;i++){ const t=i/12*2*Math.PI; s+='<line x1="'+(cx+38*Math.sin(t))+'" y1="'+(cy-38*Math.cos(t))+'" x2="'+(cx+(i%3?34:30)*Math.sin(t))+'" y2="'+(cy-(i%3?34:30)*Math.cos(t))+'" stroke="var(--plum)" stroke-width="'+(i%3?2:3.5)+'"/>'; }
  s+='<line x1="50" y1="50" x2="'+(cx+20*Math.sin(b))+'" y2="'+(cy-20*Math.cos(b))+'" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><line x1="50" y1="50" x2="'+(cx+31*Math.sin(a))+'" y2="'+(cy-31*Math.cos(a))+'" stroke="var(--bad)" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="var(--ink)"/>';
  return '<svg viewBox="0 0 100 100" width="84" role="img" aria-label="clock" style="max-width:100%;height:auto">'+s+'</svg>';
}
const clockRow = arr=>'<div class="vis"><div class="shapes">'+arr.map(t=>clockSV(t[0],t[1])).join("")+'</div></div>';

function padPut(o,k){ o.x.clearRect(0,0,o.cv.width,o.cv.height); o.x.drawImage(k,0,0); }
function initPad(){
  const c=document.getElementById("pad"); if(!c) return;
  const kind=c.dataset.kind, key=padKey(kind), x=c.getContext("2d"), o=padMem(key,c.width,c.height);
  if (o.ready) x.drawImage(o.cv,0,0);
  let on=false, lx=0, ly=0;
  const pos=e=>{const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  const seg=(a,b,d,e)=>{ x.globalCompositeOperation=PAD.er?"destination-out":"source-over"; x.strokeStyle=(kind==="board"?CHALK:INK)[PAD.c]; x.lineWidth=PAD.er?34:(kind==="board"?8:5); x.lineCap="round"; x.lineJoin="round"; x.beginPath(); x.moveTo(a,b); x.lineTo(d,e); x.stroke(); };
  c.addEventListener("pointerdown",e=>{ if(!o.ready) return; (HIST[key]=HIST[key]||[]).push(padSnap(o)); if(HIST[key].length>12) HIST[key].shift();
    const ub=document.querySelector("[data-act=pundo]"); if(ub) ub.disabled=false; REDO[key]=[]; const rb=document.querySelector("[data-act=predo]"); if(rb) rb.disabled=true; PAD.ask=false;
    on=true; try{c.setPointerCapture(e.pointerId)}catch(_){} [lx,ly]=pos(e); seg(lx,ly,lx+.1,ly+.1); e.preventDefault(); });
  c.addEventListener("pointermove",e=>{ if(!on) return; const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e]; evs.forEach(ev=>{ const [a,b]=pos(ev); seg(lx,ly,a,b); lx=a; ly=b; }); e.preventDefault(); });
  const up=()=>{ if(!on) return; on=false; o.x.clearRect(0,0,c.width,c.height); o.x.drawImage(c,0,0); padSaveLater(key); };
  c.addEventListener("pointerup",up); c.addEventListener("pointercancel",up); c.addEventListener("pointerleave",up);
  ["touchstart","touchmove","selectstart","contextmenu"].forEach(t=>c.addEventListener(t,e=>e.preventDefault(),{passive:false}));
}

/* ---------- station resume (2026-11-16, revised after Codex review) ----------
   記住整站實際的題目順序和做到第幾題。每一頁記成：本站第幾頁 {b}、別的單元第 4 站的哪一題 {r,h}（第 5 站插的複習題）、
   程式出的新數字題 {g}。回來時先比這一站的版本（全部題目內容算出的代號），題目改過、或有任何一頁找不回來，就從頭開始，不跳錯題、不少題。
   複習小站不記。那一站做完就刪掉。 */
let RESUMED=false;
const posId = i=>UNITS[U].id+"-"+i;
function fp(o){ const t=JSON.stringify(o,(k,v)=>(k==="rv"||k==="from"||k==="si"||k==="extra")?undefined:(typeof v==="function"?String(v):v)); let h=0; for(const c of t||"") h=(h*31+c.codePointAt(0))|0; return (h>>>0).toString(36)+"."+(t||"").length; }
function posDel(i){ const a=store.get("pos",{}); if(a[posId(i)]){ delete a[posId(i)]; store.set("pos",a); } }
function posSave(){
  if (view==="rv"||!/^[0-4]$/.test(view)) return;
  const i=+view; if (pg>=pages.length) return posDel(i);
  const base=UNITS[U].build[i](), bh=base.map(fp), refs=[];
  for (const p of pages){
    const h=fp(p), e=p.extra?1:0, bi=bh.indexOf(h);
    if (p.from==null && bi>=0){ refs.push({b:bi,e}); continue; }
    if (p.from!=null){ let ok=false; try{ ok=UNITS[p.from].build[3]().some(q=>fp(q)===h); }catch(_){} if(ok){ refs.push({r:p.from,ru:UNITS[p.from].id,h,rv:p.rv?1:0,si:p.si,e}); continue; } }
    if ((p.input||p.int) && !Object.values(p).some(v=>typeof v==="function")){ const g=JSON.parse(JSON.stringify(p)); refs.push({g}); continue; }
    return posDel(i);
  }
  const a=store.get("pos",{}); a[posId(i)]={s:bh.join(","), pg, refs}; store.set("pos",a);
}
function posLoad(i){
  const a=store.get("pos",{}), o=a[posId(i)]; if (!o||!Array.isArray(o.refs)) return null;
  const base=UNITS[U].build[i](), bh=base.map(fp);
  if (o.s!==bh.join(",") || !(o.pg>=0 && o.pg<o.refs.length)){ posDel(i); return null; }
  const out=[];
  for (const r of o.refs){
    if (r.b!=null){ const q=base[r.b]; if(!q) break; const c=r.e?Object.assign({},q,{extra:true}):q; out.push(c); continue; }
    if (r.r!=null||r.ru!=null){ const fi=r.ru!=null?UNITS.findIndex(u=>u.id===r.ru):r.r; let q=null; try{ q=UNITS[fi].build[3]().find(x=>fp(x)===r.h); }catch(_){} if(!q) break; q.from=fi; q.si=r.si; if(r.rv) q.rv=true; if(r.e) q.extra=true; out.push(q); continue; }
    if (r.g&&typeof r.g==="object"&&(r.g.input||r.g.int)){ out.push(r.g); continue; }
    break;
  }
  if (out.length!==o.refs.length){ posDel(i); return null; }
  return {pages:out, pg:o.pg};
}

/* ---------- learning record (把關守則第五關：分開記四種) ----------
   log: [單元 id, 第幾站(0 起), 題目代號, 結果, 第幾天]
   結果：first 第一次就自己答對、hint 看了提示才答對、retry 重試才答對、sol 看完整解法才完成、
         cfirst 複習小站第一次就答對、cmiss 複習小站沒有第一次答對 */
const today = ()=>{ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000); };
const fillKind = p=>p.num?"num":(p.input?"input":(p.int?"int":(p.q?"pick":(p.dots?"dots":""))));
function qKey(p){ const s=JSON.stringify([p.num&&p.num.ask,p.input,p.int,p.q&&p.q.ask,p.q&&p.q.opts.map(o=>o.h),p.say,p.dots&&p.dots.given]); let h=0; for(const c of s) h=(h*31+c.codePointAt(0))|0; return fillKind(p)+(h>>>0).toString(36); }
function logResult(p,kind){
  const uid=UNITS[p.from!=null?p.from:U].id, si=p.si!=null?p.si:(view==="rv"?4:+view), log=store.get("log",[]);
  log.push([uid,si,qKey(p),kind,today()]); if(log.length>8000) log.splice(0,log.length-8000); store.set("log",log);
}
function afterAnswer(t0){
  const p=pages[pg]; if(!p) return;
  if (P.ok && !P.logged){
    P.logged=true;
    const k=view==="rv"?((P.tries||0)?"cmiss":"cfirst"):(P.hint?"hint":(((P.tries||0)||(P.wrong&&P.wrong.length))?"retry":"first"));
    logResult(p,k); if(p.rv) rvBump(p, k==="first"||k==="cfirst");
  } else if (!P.ok && P.fb && (p.q || (P.tries||0)>(t0||0))) {
    const m=store.get("miss",[]); m.push([UNITS[p.from!=null?p.from:U].id, P.fb, today()]); if(m.length>30) m.splice(0,m.length-30); store.set("miss",m);
  }
}

  else if (pg>=pages.length){ sfx.win(); confetti(); }
  render(); window.scrollTo(0,0);
}

/* ---------- 看完整解法之後換一題同類型 ---------- */
function genInput(used){
  for (let t=0;t<80;t++){ const R=n=>1+Math.floor(Math.random()*n), b=1+R(8), d=1+R(8), a=R(9), c=R(9);
    if (a*d===b*c) continue; const [N,D]=simp(a*d,b*c); if (N>99||D>99||D===1) continue;
    const q={input:[a,b,c,d]}; if(!used.has(qKey(q))) return q; }
  return null;
}
function genInt(kind,used){
  for (let t=0;t<80;t++){ const g=2+Math.floor(Math.random()*7), x=1+Math.floor(Math.random()*8), y=1+Math.floor(Math.random()*8);
    if (x===y||gcd(x,y)!==1) continue; const a=g*x, b=g*y; if (a<4||b<4||lcm(a,b)>200) continue;
    const q={int:[kind,a,b]}; if(!used.has(qKey(q))) return q; }
  return null;
}
/* 數字題（num）：這一站後面還有填數字題，就直接做下一題（同一站同一類）；這一站已經是最後一題，就從同一站前面挑一題再做一次。
   分數除法（input）、最大公因數與最小公倍數（int）：照同樣的規則另外出一題新的數字。複習題：從原單元第 4 站另挑一題。 */
function sibling(p){
  const k=fillKind(p), used=new Set(pages.map(qKey));
  const mark=q=>{ if(!q) return null; const c=Object.assign({},q); c.extra=true; if(p.from!=null){ c.from=p.from; c.rv=p.rv; c.si=p.si; } return c; };
  if (k==="input") return mark(genInput(used));
  if (k==="int") return mark(genInt(p.int[0],used));
  if (p.rv){ let pool=[]; try{ pool=UNITS[p.from].build[3]().filter(q=>fillKind(q)===k&&!used.has(qKey(q))); }catch(_){} return mark(pool[Math.floor(Math.random()*pool.length)]); }
  if (pages.slice(pg+1).some(q=>fillKind(q)===k&&!q.rv)) return null;
  const earlier=pages.slice(0,pg).filter(q=>fillKind(q)===k&&!q.rv&&qKey(q)!==qKey(p));
  return mark(earlier[earlier.length-1]);
}
/* ---------- 隔幾天複習（把關守則第一關） ----------
   rv: {單元 id: {lv 第幾層, due 哪一天到期, d 完成那天}}；間隔 1、3、7、14 天，答錯回到 1 天 */
const RV_GAP=[1,3,7,14];
const rvAll = ()=>store.get("rv",{});
function rvStart(id){ const r=rvAll(); if(!r[id]){ r[id]={lv:0,due:today()+1,d:today()}; store.set("rv",r); } }
/* add a schedule for finished rooms that have none; dates already set are kept. Runs at start, after a kid switch and after a restore. */
function rvFill(){ const r=rvAll(); let ch=false; BUILT.forEach(u=>{ if(doneOf(u.id).length>=5 && !r[u.id]){ r[u.id]={lv:0,due:today(),d:null}; ch=true; } }); if(ch) store.set("rv",r); }
rvFill();
function dueUnits(){ const r=rvAll(), t=today(); return GB().filter(u=>r[u.id]&&r[u.id].due<=t).sort((a,b)=>r[a.id].due-r[b.id].due); }
function pickDue(n,ex){
  const us=dueUnits().filter(u=>u.id!==ex), out=[];
  for (let round=0; out.length<n && round<n; round++) for (const u of us){
    if (out.length>=n) break;
    let pool=[]; try{ pool=u.build[3]().filter(q=>{ const k=fillKind(q); return k&&k!=="pick"; }); }catch(_){}
    pool=pool.filter(q=>!out.some(o=>qKey(o)===qKey(q))); if(!pool.length) continue;
    const q=pool[Math.floor(Math.random()*pool.length)]; q.rv=true; q.from=UNITS.indexOf(u); q.si=3; out.push(q);
  }
  return out;
}
function rvBump(p,ok){
  const id=UNITS[p.from].id, r=rvAll(), e=r[id]; if(!e) return; const t=today();
  if (ok){ if(e.due<=t){ e.lv=Math.min(e.lv+1,RV_GAP.length-1); e.due=t+RV_GAP[e.lv]; } } else { e.lv=0; e.due=t+1; }
  r[id]=e; store.set("rv",r);
}

function initHold(){

  const stop=()=>{ clearTimeout(t); t=null; b.classList.remove("on"); };
  b.addEventListener("pointerdown",e=>{ e.preventDefault(); b.classList.add("on"); clearTimeout(t); t=setTimeout(()=>{ GATE=false; view="parent"; RS=null; BKMSG=null; sfx.go(); render(); window.scrollTo(0,0); },3000); });
  ["pointerup","pointerleave","pointercancel"].forEach(k=>b.addEventListener(k,stop));
  ["touchstart","contextmenu","selectstart"].forEach(k=>b.addEventListener(k,e=>e.preventDefault(),{passive:false}));

const BK_KEYS = ()=>{ const ks=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf("bum-")===0&&k!=="bum-calc") ks.push(k); } }catch(_){} return ks; };
function unitStat(u){
  const all=store.get("log",[]), log=all.filter(r=>r[0]===u.id&&r[1]>=2&&["first","hint","retry","sol"].includes(r[3]));
  const c={first:0,hint:0,retry:0,sol:0}; log.forEach(r=>c[r[3]]++);
  const n=log.length, chk=all.some(r=>r[0]===u.id&&r[3]==="cfirst"), rv=rvAll()[u.id];
  let st;

const BK_VERSIONS=[1,2];
function parseBackup(text){
  const bad=L("檔案壞掉了，讀不出來。資料沒有改變。","The file is damaged and cannot be read. Nothing was changed.");
  if (!text||!text.trim()) return {err:L("沒有內容。先選檔案或貼上備份文字。","Nothing to restore. Choose a file or paste the backup text first.")};
  if (text.length>8e6) return {err:L("內容太大，不是這個遊戲的備份。資料沒有改變。","Too large to be a backup from this game. Nothing was changed.")};
  let o; try{ o=JSON.parse(text.trim()); }catch(_){ return {err:bad}; }
  if (!o||o.app!=="bunny-math") return {err:L("這不是兔兔獨角獸數學學院的備份。資料沒有改變。","This is not a Bunny Unicorn Math Academy backup. Nothing was changed.")};
  if (!BK_VERSIONS.includes(o.v)) return {err:L("這份備份的版本讀不了。資料沒有改變。","This backup version cannot be read. Nothing was changed.")};
  if (!o.data||typeof o.data!=="object"||Array.isArray(o.data)) return {err:bad};
  for (const [k,v] of Object.entries(o.data)){ if(k.indexOf("bum-")!==0||typeof v!=="string") return {err:bad}; try{ JSON.parse(v); }catch(_){ return {err:bad}; } }
  if (o.v===2){
    let kd; try{ kd=JSON.parse(o.data["bum-kids"]||"null"); }catch(_){ kd=null; }
    const okA=a=>ANIMALS.some(x=>x[0]===a);
    if (!kd||!Array.isArray(kd.list)||!kd.list.every(okA)||new Set(kd.list).size!==kd.list.length||(kd.list.length&&!kd.list.includes(kd.active))||(kd.legacy!=null&&!kd.list.includes(kd.legacy))) return {err:bad};
    for (const k of Object.keys(o.data)){ const m=k.match(/^bum-@([a-z]+)-/); if(m&&(!kd.list.includes(m[1])||m[1]===kd.legacy)) return {err:bad}; }
    o.kids=kd;
  }
  return {ok:o};
}

  let lg=0; try{ const x=JSON.parse(d[pre+"log"]||"[]"); lg=Array.isArray(x)?x.length:0; }catch(_){}
  const draw=["pad-board","pad-note-1","pad-note-2","pad-note-3"].filter(k=>d[pre+k]).length;

/* write, then verify every key; on failure put the snapshot back and verify again; if that fails too, offer a rescue file. */
function lsWrite(rm, put){
  rm.forEach(k=>localStorage.removeItem(k)); Object.entries(put).forEach(([k,v])=>localStorage.setItem(k,v));
  return Object.entries(put).every(([k,v])=>localStorage.getItem(k)===v) && rm.every(k=>(k in put)||localStorage.getItem(k)===null);
}

  if (act==="pclr"){ if(!PAD.ask){PAD.ask=true}else{PAD.ask=false; const hk=padKey(curKind()), o=PADC[hk]; if(o){ (HIST[hk]=HIST[hk]||[]).push(padSnap(o)); o.x.clearRect(0,0,o.cv.width,o.cv.height); REDO[hk]=[]; } if(PADT[hk]){ clearTimeout(PADT[hk]); delete PADT[hk]; } store.del(hk); } sfx.tap(); return render(); }
  if (act==="npage"){ PAD.page=Math.max(1,Math.min(3,PAD.page+ +v)); PAD.ask=false; sfx.tap(); return render(); }
  if (act==="unit"){ U=+v; TERM=UNITS[U].t; store.set(termKey(),TERM); done=doneOf(UNITS[U].id); view="unit"; help=false; sfx.tap(); render(); return window.scrollTo(0,0); }
  if (act==="open"){ sfx.go(); return open(+v); }
  if (act==="restart"){ const i=+view; posDel(i); sfx.tap(); return open(i,true); }
  if (act==="stuck"){ help=true; sfx.tap(); return render(); }
  if (act==="unstuck"){ help=false; sfx.tap(); return render(); }
  if (act==="cut"){ P.cut=true; sfx.tap(); return render(); }
  if (act==="next") return goNext();
  if (act==="sol"){ P.solShown=true; P.fb=null; sfx.tap(); return render(); }
  if (act==="solnext"){ const p=pages[pg]; logResult(p, view==="rv"?"cmiss":"sol"); if(p.rv) rvBump(p,false); if(view!=="rv"){ const sb=sibling(p); if(sb) pages.splice(pg+1,0,sb); } return goNext(); }
  if (act==="rvgo"){ calc=false; calcReset(); view="rv"; pages=pickDue(3,null); pg=0; P={}; help=false; sfx.go(); render(); return window.scrollTo(0,0); }
  if (act==="pgate"){ GATE=true; sfx.tap(); return render(); }
  if (act==="who"){ WHO=true; WHOADD=false; sfx.tap(); return render(); }
  if (act==="whox"){ WHO=false; WHOADD=false; sfx.tap(); return render(); }
  if (act==="kidadd"){ WHOADD=true; sfx.tap(); return render(); }
  if (act==="kidback"){ WHOADD=false; sfx.tap(); return render(); }
  if (act==="kidgo"){ if(v===KIDS.active){ WHO=false; sfx.tap(); return render(); } return kidSwitch(v,false); }
  if (act==="kidnew") return kidSwitch(v,true);
  if (act==="kdel"){ DELASK=v; sfx.tap(); return render(); }
  if (act==="kdelno"){ DELASK=null; sfx.tap(); return render(); }
  if (act==="kdelok") return kidDelete(v);
  if (act==="gatex"){ GATE=false; sfx.tap(); return render(); }
  if (act==="bkdl") return backupDownload();
  if (act==="bkcp") return backupCopy();
  if (act==="rsfile"){ const f=document.getElementById("rsfile"); if(f) f.click(); return; }
  if (act==="rspaste"){ const t=document.getElementById("rstxt"); return restorePreview(t?t.value:""); }
  if (act==="rsok") return restoreApply();
  if (act==="rescue"){ if(RESCUE){ try{ const x=document.createElement("a"); x.href=URL.createObjectURL(new Blob([RESCUE],{type:"application/json"})); x.download="bunny-math-rescue.json"; document.body.appendChild(x); x.click(); setTimeout(()=>{ URL.revokeObjectURL(x.href); x.remove(); },1000); }catch(_){} } return; }
  if (act==="rsno"){ RS=null; sfx.tap(); return render(); }
  if (act==="dot"){ const s2=P.sel||[]; P.sel=s2.includes(v)?s2.filter(k=>k!==v):s2.concat(v); P.fb=null; sfx.tap(); return render(); }
  if (act==="dotundo"){ P.sel=(P.sel||[]).slice(0,-1); P.fb=null; sfx.tap(); return render(); }
  if (act==="dotclr"){ P.sel=[]; P.fb=null; sfx.tap(); return render(); }
  if (act==="dotchk"){ const t0=P.tries||0; checkDots(pages[pg].dots); afterAnswer(t0); return render(); }
  if (act==="pick"){
    const o=pages[pg].q.opts[+v];
    if (o.ok){ P.ok=true; P.fb=null; sfx.right(); }
    else { P.wrong=(P.wrong||[]).concat(+v); P.fb=o.fb; sfx.tap(); }
    afterAnswer(); return render();
  }
  if (act==="focus"){ P.focus=v; sfx.tap(); return render(); }
  if (act==="key"){
    const k=P.focus==="den"&&pages[pg].input?"den":"num"; P[k]=P[k]||"";
    if (v==="x") P[k]=P[k].slice(0,-1); else if (v===".") { if(!P[k].includes(".")&&P[k].length<5) P[k]=(P[k]||"0")+"."; } else if (P[k].length<(P[k].includes(".")?6:(pages[pg].num?6:3))) P[k]=(P[k]==="0"?"":P[k])+v;
    P.fb=null; sfx.tap(); return render();
  }
  if (act==="hint"){ P.hint=Math.min(2,(P.hint||0)+1); P.fb=null; sfx.tap(); return render(); }
  if (act==="check"){ P.num=P.num||""; P.den=P.den||""; const t0=P.tries||0; pages[pg].num?checkNum():(pages[pg].int?checkInt():checkInput()); afterAnswer(t0); return render(); }
});
let SW=null;
document.addEventListener("touchstart",e=>{ const t=e.touches[0]; SW=(e.touches.length===1&&!e.target.closest("canvas,.stk,.bookpage,.sheet,.pad,.padwrap,.dotq"))?{x:t.clientX,y:t.clientY,t:Date.now()}:null; },{passive:true});
document.addEventListener("touchend",e=>{ if(!SW) return; const t=e.changedTouches[0], dx=t.clientX-SW.x, dy=t.clientY-SW.y, dt=Date.now()-SW.t; SW=null;
  if (dx>=70 && Math.abs(dx)>1.5*Math.abs(dy) && dt<700) { const f=document.querySelector(".fab"); if(f) f.click(); } },{passive:true});
render();
